# Mission and propagator configuration for SAL-E 

# Orekit auxiliary data (Earth orientation, leap seconds, gravity, etc.).
orekit_data_path: "orekit-data"

# Space weather file for drag
space_weather_file: "orekit-data/CSSI-Space-Weather-Data/SpaceWeather-All-v1.2.txt"

# Doppler data directory: subdirs per station (SALE-Doppler/Marconi/, SALE-Doppler/EEDepartment/)
doppler_data_dir: "SALE-Doppler"

cache_dir: "TLE-Cache"

# Space-Track TLE filter: launch date (Transporter 16 projected 03.29) and launch site code (AFWTR is Vandenberg).
launch_date: "2026-03-29"
launch_site: "AFWTR"

# SAL-E frequency
frequency_hz: 436965000

# frames
ecef_frame: FramesFactory.getITRF(ITRFVersion.ITRF_2008, IERSConventions.IERS_2010, False)
inertial_frame: FramesFactory.getEME2000()

# INPUT INITIAL STATE HERE
position_m: [4933369.747, 4622640.396, -1355244.697] #m, ECEF (SpaceX OPM r_ecef_m)
velocity_mps: [2098.608, -83.929, 7394.093] #m/s, ECEF Earth-relative (SpaceX OPM v_ecef_m_per_s)
epoch: AbsoluteDate(2026, 3, 30, 11, 15, 30, 0.608,utc) # orekit absolute date (deployment epoch)
epoch_utc: "2026-03-30T11:15:30.148Z" # ISO-8601 string (SpaceX OPM deployment date)

# Debug: enable one-time sanity printouts at startup
debug: false


# Drag params
# Using 3U average surface area (m^2).
area_m2: 0.14
# Drag coefficient
cd: 2.2
# FU mass as built (kg)
mass_kg: 2.89